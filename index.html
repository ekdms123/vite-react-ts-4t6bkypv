<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>현실의 마도서 (Grimoire of Reality)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* [v10.3 Fixed Theme: Royal Light] */
        --bg-paper: #fdfbf7;
        --primary: #4f46e5;
        --accent: #c5a059; /* Gold */
        --accent-hover: #b08d45;
        
        --glass-white: rgba(255, 255, 255, 0.90);
        --glass-border: rgba(197, 160, 89, 0.3);
        
        --text-dark: #2d3748;
        --text-sub: #718096;
      }
      
      body {
        background-color: var(--bg-paper);
        background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
        color: var(--text-dark);
        font-family: 'Noto Sans KR', sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        /* iOS Safe Area handling */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .font-cinzel { font-family: 'Cinzel', serif; }
      .font-serif { font-family: 'Nanum Myeongjo', serif; }

      /* Royal Glass Panel */
      .panel-game {
        background: var(--glass-white);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid #fff;
        box-shadow: 0 8px 32px rgba(197, 160, 89, 0.15); /* Gold shadow */
        border-radius: 16px;
      }
      
      .panel-glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .btn-game {
        background: linear-gradient(135deg, #fff 0%, #f7f7f7 100%);
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition: all 0.2s;
      }
      .btn-game:active { transform: scale(0.95); }

      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
      
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
      .animate-float { animation: float 3s ease-in-out infinite; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
