<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Calendar</title>
<style>
html,body{margin:0;padding:0;background:#fafaf7;color:#171717;font-family:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
.wrap{width:100%;min-height:640px;background:#fafaf7;padding:0;overflow:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 14px 8px;border-bottom:2px solid #171717}
.head strong{font-size:28px;letter-spacing:-.02em}
.head span{font-size:11px;letter-spacing:.12em;color:#777}
.frame{position:relative;width:100%;height:610px;overflow:hidden;background:#fafaf7}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fafaf7;filter:grayscale(1) contrast(1.04)}
@media(max-width:480px){
  .wrap{min-height:600px}
  .head{padding:10px 8px 7px}
  .head strong{font-size:23px}
  .frame{height:565px}
  iframe{width:138%;transform:scale(.725);transform-origin:0 0;height:138%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><strong id="label">MONTH</strong><span>GOOGLE CALENDAR · LIVE</span></div>
  <div class="frame"><iframe id="cal" title="Google Calendar month"></iframe></div>
</div>
<script>
const p=new URLSearchParams(location.search);
const ids=[p.get('c1'),p.get('c2'),p.get('c3')].filter(Boolean);
const colors=['%23171717','%23444444','%23777777'];
const now=new Date();
const months=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
document.getElementById('label').textContent=months[now.getMonth()]+' '+now.getFullYear();
let u='https://calendar.google.com/calendar/embed?height=800&wkst=2&ctz=Asia%2FSeoul&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showTitle=0&mode=MONTH&bgcolor=%23fafaf7';
ids.forEach((id,i)=>{u+='&src='+encodeURIComponent(id)+'&color='+colors[i%colors.length]});
document.getElementById('cal').src=u;
</script>
</body>
</html>
