<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Calendar</title>
<style>
html,body{margin:0;padding:0;background:#fafaf7;color:#171717}
*{box-sizing:border-box}
.wrap{width:100%;height:640px;background:#fafaf7;overflow:hidden;border-top:2px solid #171717;border-bottom:1px solid #171717}
iframe{display:block;width:100%;height:100%;border:0;background:#fafaf7;filter:grayscale(1) contrast(1.08)}
@media(max-width:480px){
  .wrap{height:610px}
  iframe{width:136%;height:136%;transform:scale(.735);transform-origin:0 0}
}
</style>
</head>
<body>
<div class="wrap"><iframe id="cal" title="Google Calendar month" referrerpolicy="no-referrer"></iframe></div>
<script>
const p=new URLSearchParams(location.hash.slice(1));
const ids=[p.get('c1'),p.get('c2'),p.get('c3')].filter(Boolean);
const colors=['%23171717','%23444444','%23777777'];
let u='https://calendar.google.com/calendar/embed?height=800&wkst=2&ctz=Asia%2FSeoul&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=1&showDate=1&mode=MONTH&bgcolor=%23fafaf7';
ids.forEach((id,i)=>{u+='&src='+encodeURIComponent(id)+'&color='+colors[i%colors.length]});
document.getElementById('cal').src=u;
</script>
</body>
</html>
